name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: lintr

      - name: Run lintr
        run: |
          lintr::lint_package()
        shell: Rscript {0}

  check:
    name: R CMD check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: ['release']
        include:
          - os: ubuntu-latest
            r-version: 'oldrel-1'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
      TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Run testthat
        run: |
          testthat::test_local(reporter = "summary")
        shell: Rscript {0}
