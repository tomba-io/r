name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: R CMD build
        run: |
          R CMD build .

      - name: Get package version
        id: pkg
        run: |
          VERSION=$(Rscript -e "cat(as.character(read.dcf('DESCRIPTION', 'Version')))")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=tomba_${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: R CMD check
        run: |
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --as-cran --no-tests ${{ steps.pkg.outputs.tarball }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.pkg.outputs.version }}"
          files: ${{ steps.pkg.outputs.tarball }}
          generate_release_notes: true
